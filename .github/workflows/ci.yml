name: Quality Gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  security:
    name: Security and artifact guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        run: python3 scripts/ci/secret_scan.py
      - name: Artifact guard
        run: python3 scripts/ci/artifact_guard.py
      - name: Public deployment registry
        run: python3 scripts/ci/validate_deployment_registry.py
      - name: Hidden local Codex skill guard
        run: |
          if git ls-files --error-unmatch .codex/skills/cosmos-vulnerability-scanner >/dev/null 2>&1; then
            echo "::error::.codex/skills/cosmos-vulnerability-scanner must stay untracked"
            exit 1
          fi

  rust:
    name: Rust fmt and tests
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust tests
        run: cargo test --workspace

  sdk:
    name: SDK typecheck
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
        working-directory: sdk
      - run: npm run typecheck
        working-directory: sdk

  integration-services:
    name: Postgres and Redis service readiness
    runs-on: ubuntu-latest
    needs: security
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: entropis_ci
          POSTGRES_USER: entropis
          POSTGRES_PASSWORD: entropis_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U entropis -d entropis_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Verify service sockets
        shell: bash
        run: |
          set -euo pipefail
          for port in 5432 6379; do
            ready=0
            for attempt in {1..30}; do
              if timeout 1 bash -c "echo > /dev/tcp/127.0.0.1/${port}" >/dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "${ready}" -ne 1 ]; then
              echo "::error::service on port ${port} did not become ready"
              exit 1
            fi
          done

  acton:
    name: Acton contract checks
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4
      - name: Install Acton
        id: setup-acton
        uses: ton-blockchain/setup-acton@2d38fd579e1bf8753a3e0cff9ad695612b98a676 # v1.0.0
        with:
          version: '1.1.0'
          platform: linux
          architecture: x86_64
          save-cache: true
      - name: Acton install summary
        run: |
          echo "Acton path: ${{ steps.setup-acton.outputs.acton-path }}"
          echo "Acton version: ${{ steps.setup-acton.outputs.acton-version }}"
          echo "Cache hit: ${{ steps.setup-acton.outputs.cache-hit }}"
      - name: Contract checks
        env:
          ACTON_CHECK_OUTPUT_FORMAT: github
        run: bash scripts/ci/acton_contract_checks.sh
