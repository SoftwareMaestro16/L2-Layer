[workspace]
members = [
    "crates/l2-core",
    "crates/l2-node",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/SoftwareMaestro16/L2-Layer"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.99"
async-trait = "0.1.89"
axum = { version = "0.7.9", features = ["ws"] }
base64 = "0.22.1"
dotenvy = "0.15.7"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
hex = "0.4.3"
num-bigint = "0.4.6"
rand_core = "0.6.4"
redis = { version = "0.27.6", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros", "json"] }
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tonlib-core = "0.26.11"
tonlib-sys = { version = "2026.5.0", default-features = false, features = ["cmake", "shared-tonlib"] }
tower-http = { version = "0.6.6", features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
