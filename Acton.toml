[package]
name = "ton-l2-rollup-contracts"
version = "0.1.0"
description = "Tolk L1 settlement contracts for a TON-anchored optimistic L2 rollup"
license = "Apache-2.0"

[toolchain]
acton = "1.1.0"

[contracts.RollupRoot]
display-name = "Rollup Root"
src = "contracts/l1/rollup-root/rollup_root.tolk"
depends = []

[contracts.AssetVault]
display-name = "Asset Vault"
src = "contracts/l1/asset-vault/asset_vault.tolk"
depends = []

[contracts.SampleL2Counter]
display-name = "Sample L2 Counter"
src = "examples/l2-counter/counter.tolk"
depends = []

[fmt]
width = 100
ignore = []

[wrappers.tolk]
output-dir = "wrappers"

[wrappers.typescript]
output-dir = "sdk/src/generated"

[test]

[scripts]
l1-deploy-plan = "acton script scripts/l1/deploy_rollup_pair.tolk"
l1-deploy-testnet = "acton script scripts/l1/deploy_rollup_pair.tolk --net testnet --explorer tonviewer"
l1-verify-testnet = "acton script scripts/l1/verify_rollup_pair.tolk --fork-net testnet"
l1-deposit-testnet = "acton script scripts/l1/deposit_ton.tolk --net testnet --explorer tonviewer"
l1-commit-testnet = "acton script scripts/l1/commit_batch.tolk --net testnet --explorer tonviewer"
l1-finalize-testnet = "acton script scripts/l1/finalize_batch.tolk --net testnet --explorer tonviewer"
l1-claim-testnet = "acton script scripts/l1/claim_withdrawal.tolk --net testnet --explorer tonviewer"
l1-stake-bond-testnet = "acton script scripts/l1/stake_sequencer_bond.tolk --net testnet --explorer tonviewer"
l1-challenge-testnet = "acton script scripts/l1/challenge_batch.tolk --net testnet --explorer tonviewer"
l1-resolve-challenge-testnet = "acton script scripts/l1/resolve_challenge.tolk --net testnet --explorer tonviewer"

[import-mappings]
acton = ".acton"
shared = "contracts/l1/shared"
contracts = "contracts/l1"
gen = "gen"
tests = "tests"
scripts = "scripts"
wrappers = "wrappers"
examples = "examples"
